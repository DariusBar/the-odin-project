<!DOCTYPE html>

<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1"></meta>
        <link rel="stylesheet" href="tic.css">
        <title>Tic Tac Toe</title>
        
    </head>
    <body>
        <div class="playerNames">
            <div class="inputDiv">
                <label for="player1">Player 1: </label>
                <input type="text" name="player1" id="player1">
            </div>
            <div class="inputDiv">
                <label for="player2">Player 2: </label>
                <input type="text" name="player2" id="player2">
            </div>
            <button id="startGame" class="btn">Start Game</button>
        </div>
        <div id="turns"></div>
        <div class="gridContainer">
            <div id="grid">
                <div id="00" class="cell">
                    <button></button>
                </div>
                <div id="01" class="cell">
                    <button></button>
                </div>
                <div id="02" class="cell">
                    <button></button>
                </div>
                <div id="10" class="cell">
                    <button></button>
                </div>
                <div id="11" class="cell">
                    <button></button>
                </div>
                <div id="12" class="cell">
                    <button></button>
                </div>
                <div id="20" class="cell">
                    <button></button>
                </div>
                <div id="21" class="cell">
                    <button></button>
                </div>
                <div id="22" class="cell">
                    <button></button>
                </div> 
            </div>
        </div>

    </body>
    <script src="tic.js"></script>
</html>
